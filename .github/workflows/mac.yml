# Builds the Mac app for a release on a Mac (Apple's tools only run on macOS) and attaches it to the
# release: Desktop Wizard-<version>-mac.dmg, to install from, and -mac.zip, which Mac copies update
# from. It runs when a release is published (npm run release does that), or by hand from the
# repository's Actions tab for a release that's already out. The zip's signature (.sig) isn't made
# here: the release key never comes to GitHub, so run npm run release again once this has finished,
# and it signs the zip on the PC with the key (docs/RELEASING.md).

name: Mac build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release to build for (its tag, the version, such as 2.8.0)
        required: true

# Attaching files to the release.
permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check the release is this version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$version" != "${TAG#v}" ]; then
            echo "The release $TAG isn't version $version (apps/desktop/package.json)."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The app for Apple silicon and Intel Macs together, signed ad hoc (no Apple Developer ID).
      - run: npm run dist:mac

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            "apps/desktop/dist/Desktop Wizard-$VERSION-mac.dmg" \
            "apps/desktop/dist/Desktop Wizard-$VERSION-mac.zip" \
            --clobber
